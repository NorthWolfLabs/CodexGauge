name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What user need is not met today?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed experience
      description: Explain the desired behavior and why it belongs in a read-only local menu-bar utility.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
