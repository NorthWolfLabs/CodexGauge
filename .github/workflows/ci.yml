name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select required stable Xcode
        run: |
          candidate="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26.6*.app' -print -quit)"
          if [[ -n "$candidate" ]]; then sudo xcode-select --switch "$candidate/Contents/Developer"; fi
          ./Scripts/check-toolchain.sh
      - name: Check repository and documentation
        run: ./Scripts/check-repository.sh
      - name: Verify Universal 2 release build
        shell: zsh {0}
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/UniversalDerivedData"
          xcodebuild build \
            -project CodexGauge.xcodeproj \
            -scheme CodexGauge \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$derived" \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO
          binary="$derived/Build/Products/Release/CodexGauge.app/Contents/MacOS/CodexGauge"
          archs="$(lipo -archs "$binary")"
          [[ " $archs " == *' arm64 '* && " $archs " == *' x86_64 '* && "$(wc -w <<< "$archs" | tr -d ' ')" == 2 ]]

  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 14 · Apple silicon
            id: macos-14-arm64
            macos: 14
            runner: macos-14
            arch: arm64
            current_toolchain: false
          - name: macOS 26 · Apple silicon
            id: macos-26-arm64
            macos: 26
            runner: macos-26
            arch: arm64
            current_toolchain: true
          - name: macOS 15 · Intel
            id: macos-15-x86_64
            macos: 15
            runner: macos-15-intel
            arch: x86_64
            current_toolchain: false
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select compatibility Xcode
        shell: zsh {0}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.current_toolchain }}" == true ]]; then
            candidate="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26.6*.app' -print -quit)"
            [[ -n "$candidate" ]] || { print -u2 'Xcode 26.6 is unavailable'; exit 1; }
            sudo xcode-select --switch "$candidate/Contents/Developer"
            ./Scripts/check-toolchain.sh
          else
            candidate="$(find /Applications -maxdepth 1 -type d -name 'Xcode_16*.app' -print | sort | tail -n 1)"
            [[ -n "$candidate" ]] || { print -u2 'A macOS 14-compatible Xcode 16 is unavailable'; exit 1; }
            sudo xcode-select --switch "$candidate/Contents/Developer"
            xcodebuild -version
          fi
      - name: Build, test, and inspect diagnostics
        shell: zsh {0}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/CodexGauge-${{ matrix.id }}.xcresult"
          log_file="$RUNNER_TEMP/xcodebuild-${{ matrix.id }}.log"
          started="$(date '+%Y-%m-%d %H:%M:%S')"
          xcodebuild test \
            -project CodexGauge.xcodeproj \
            -scheme CodexGauge \
            -configuration Debug \
            -destination 'platform=macOS,arch=${{ matrix.arch }}' \
            -resultBundlePath "$result" \
            ARCHS='${{ matrix.arch }}' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= 2>&1 | tee "$log_file"
          xcodebuild build \
            -project CodexGauge.xcodeproj \
            -scheme CodexGauge \
            -configuration Release \
            -destination 'platform=macOS,arch=${{ matrix.arch }}' \
            ARCHS='${{ matrix.arch }}' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee -a "$log_file"
          xcodebuild archive \
            -project CodexGauge.xcodeproj \
            -scheme CodexGauge \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/CodexGauge-unsigned.xcarchive" \
            ARCHS='${{ matrix.arch }}' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee -a "$log_file"
          /usr/bin/log show --start "$started" --style compact \
            --predicate 'process == "CodexGauge" OR process == "CodexGaugeUITests-Runner"' \
            > "$RUNNER_TEMP/runtime-${{ matrix.id }}.log" || true
          # Xcode 26.6 emits this internal testmanager QoS diagnostic when it
          # attaches a hosted unit-test bundle. It reproduces with all product UI
          # and background work disabled and does not occur in the standalone
          # signed Release app. Keep the exception exact and confined to XCTest's
          # runtime log; every other runtime issue remains release-blocking.
          grep -Ev \
            'com\.apple\.runtime-issues:Hang Risk.*"message":"\[Internal\] Thread running at User-interactive quality-of-service class waiting on a lower QoS thread running at Default quality-of-service class\. Investigate ways to avoid priority inversions".*"antipattern trigger":"dispatch_semaphore_wait"' \
            "$RUNNER_TEMP/runtime-${{ matrix.id }}.log" \
            > "$RUNNER_TEMP/runtime-filtered-${{ matrix.id }}.log" || true
          if grep -Ei 'com\.apple\.runtime-issues|Invalid frame dimension|negative or non-finite|Custom UnitPoint values are not supported|Charts:|Unable to simultaneously satisfy constraints|Publishing changes from within view updates|AttributeGraph: cycle|main thread as it may lead to UI unresponsiveness|main actor-isolated.*nonisolated|main-thread XCTest|accessibility.*failed|warning:.*(Sendable|actor-isolated|concurr)' \
            "$log_file" "$RUNNER_TEMP/runtime-filtered-${{ matrix.id }}.log"; then
            echo "Release-blocking warning or runtime fault detected." >&2
            exit 1
          fi
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: failure-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/CodexGauge-${{ matrix.id }}.xcresult
            ${{ runner.temp }}/xcodebuild-${{ matrix.id }}.log
            ${{ runner.temp }}/runtime-${{ matrix.id }}.log
          if-no-files-found: ignore
          retention-days: 14
