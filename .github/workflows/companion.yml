name: Companion checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: companion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-and-relay:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version: '0.2.1'
          node-version: '24'
          working-directory: Companion/Relay
          run-install: false
          cache: true
      - name: Install locked dependencies
        working-directory: Companion/Relay
        run: vp install --frozen-lockfile
      - name: Check shared Swift models and isolated relay
        run: ./Scripts/check-companion.sh
      - name: Build iPhone app and widgets for Simulator
        run: |
          xcodebuild build \
            -project Companion/TokenTachMobile.xcodeproj \
            -scheme TokenTachMobile -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/CompanionDerivedData" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=-
